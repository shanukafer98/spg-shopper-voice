<script>
/* ==========================================================================
   SPG SHOPPER VOICE — front-end
   Sinhala speech recognition runs HERE, in the browser (Chrome Web Speech API).
   There is no paid speech API and no Google Cloud project anywhere in this app.
   Works in two deployment modes:
     1. Static hosting (recommended — microphone works)  -> fetch() to Apps Script
     2. Served by Apps Script (debug only)               -> google.script.run
   ========================================================================== */

/* The Apps Script web app address. Three ways to set it, in priority order:
     1. paste it here (best — the hosted file then needs no setup at all)
     2. open the app once as  https://your-site/?api=<exec url>
     3. type it into the one-time setup box on the login screen
   Options 2 and 3 remember the address on that phone. */
var API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_EXEC_URL_HERE';

function resolveApiUrl() {
  try {
    var q = new URLSearchParams(window.location.search).get('api');
    if (q) {
      localStorage.setItem('apiUrl', q);
      window.history.replaceState({}, '', window.location.pathname);   // tidy the address
      return q;
    }
  } catch (e) {}
  if (API_URL.indexOf('PASTE_') !== 0) return API_URL;
  try { return localStorage.getItem('apiUrl') || ''; } catch (e) { return ''; }
}

var App = (function () {
  'use strict';

  /* ------------------------------------------------------------------ */
  /* transport                                                          */
  /* ------------------------------------------------------------------ */
  var IN_GAS = (typeof google !== 'undefined' && google.script && google.script.run);
  var IN_FRAME = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var SANDBOXED = !!(IN_GAS || IN_FRAME);

  function api(action, payload) {
    var body = Object.assign({ action: action }, payload || {});
    if (IN_GAS) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (s) { try { resolve(JSON.parse(s)); } catch (e) { reject(e); } })
          .withFailureHandler(reject)
          .apiBridge(JSON.stringify(body));
      });
    }
    var url = resolveApiUrl();
    if (!url) return Promise.reject(new Error('NO_API_URL'));
    return fetch(url, {
      method: 'POST',
      // text/plain keeps this a CORS "simple request" -> no preflight
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  /* ------------------------------------------------------------------ */
  /* state + tiny helpers                                               */
  /* ------------------------------------------------------------------ */
  var S = {
    spg: null, products: [], maxSeconds: 120,
    rec: null, chunks: [], mime: '', stream: null,
    startedAt: 0, duration: 0, timerId: null, rafId: null,
    audioCtx: null, analyser: null, speech: null, liveText: '', recognising: false, srSupported: false,
    blob: null, blobUrl: null, current: null, mode: 'BOTH', srError: '', diag: [], diagRec: false, diagSr: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var mmss = function (s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  var toastTimer = null;
  function toast(title, msg, kind) {
    var t = $('toast');
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    t.innerHTML = '<b>' + esc(title) + '</b>' + (msg ? esc(msg) : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 4600);
  }
  function busy(on, text) {
    $('overlayText').textContent = text || 'Working…';
    $('overlay').className = 'overlay' + (on ? ' show' : '');
  }

  /* ------------------------------------------------------------------ */
  /* navigation                                                         */
  /* ------------------------------------------------------------------ */
  var NAV_SCREENS = { home: 1, record: 1, history: 1, diag: 1 };
  function go(name) {
    ['login', 'home', 'record', 'review', 'success', 'history', 'diag'].forEach(function (n) {
      $('s-' + n).classList.toggle('active', n === name);
    });
    $('nav').className = 'nav' + (S.spg && NAV_SCREENS[name] ? ' show' : '');
    Array.prototype.forEach.call(document.querySelectorAll('.nav button'), function (b) {
      b.classList.toggle('on', b.dataset.go === name);
    });
    if (name === 'history') loadHistory();
    if (name === 'diag') paintDiagFacts();
    window.scrollTo(0, 0);
  }

  /* ------------------------------------------------------------------ */
  /* login                                                              */
  /* ------------------------------------------------------------------ */
  function login() {
    var code = ($('spgCode').value || '').trim().toUpperCase();
    if (!code) { toast('Enter your SPG code', 'For example SPG001', 'err'); return; }
    busy(true, 'Signing in…');
    api('bootstrap', { spgCode: code }).then(function (r) {
      busy(false);
      if (!r.ok) { toast('Sign in failed', r.message || 'Please try again.', 'err'); return; }
      S.spg = r.spg;
      S.products = r.products || [];
      S.maxSeconds = r.maxSeconds || 120;
      try { localStorage.setItem('spgCode', S.spg.code); } catch (e) {}
      paintHome(r.todayCount || 0);
      fillProducts();
      go('home');
    })['catch'](function () {
      busy(false);
      toast('No connection', 'We could not reach the server. Check your internet and try again.', 'err');
    });
  }

  function logout() {
    S.spg = null;
    try { localStorage.removeItem('spgCode'); } catch (e) {}
    $('spgCode').value = '';
    go('login');
  }

  function paintHome(count) {
    var h = new Date().getHours();
    var part = h < 12 ? 'Good Morning' : (h < 17 ? 'Good Afternoon' : 'Good Evening');
    $('greeting').textContent = part + ', ' + S.spg.code;
    $('whoami').textContent = S.spg.name + ' (' + S.spg.code + ')';
    $('avatar').textContent = S.spg.code.replace(/[^0-9]/g, '').slice(-3) || 'SPG';
    $('regionPill').textContent = S.spg.region || 'Field';
    $('todayCount').textContent = count;
  }

  function fillProducts() {
    var sel = $('product');
    sel.innerHTML = '<option value="">Select a product…</option>' +
      S.products.map(function (p) {
        return '<option value="' + esc(p.code) + '" data-name="' + esc(p.name) + '">' + esc(p.name) + '</option>';
      }).join('');
    if (!S.products.length) sel.innerHTML = '<option value="">No active products found</option>';
  }

  /* ------------------------------------------------------------------ */
  /* new feedback                                                       */
  /* ------------------------------------------------------------------ */
  function startNew() {
    if (!S.spg) { go('login'); return; }
    $('consent').checked = false;
    $('product').value = '';
    resetRecorderUI();
    go('record');
    updateMicState();
  }

  var MODE_HINTS = {
    AUDIO: 'Records the shopper. The SPG then dictates the feedback with the keyboard microphone. Works on every phone, including iPhone.',
    BOTH: 'Tries to record and transcribe at the same time. Many Android phones will not allow both — run the microphone test below before choosing this.',
    TRANSCRIPT: 'Live Sinhala text only. No audio file is saved, so use this only where the transcript matters more than the recording.'
  };

  function setMode(m) {
    S.mode = m;
    try { localStorage.setItem('captureMode', m); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
      b.classList.toggle('on', b.dataset.mode === m);
    });
    if ($('modeHint')) $('modeHint').textContent = MODE_HINTS[m];
    updateMicState();
  }

  function updateMicState() {
    if (SANDBOXED) {
      $('micBtn').disabled = true;
      $('micHint').innerHTML = '<b style="color:var(--rec)">Recording is not available on this address</b><br>' +
        'This page is running inside Google Apps Script, which blocks the microphone. ' +
        'Open the hosted app address instead.';
      return;
    }
    var ready = !!$('product').value && $('consent').checked;
    $('micBtn').disabled = !ready;
    $('micHint').textContent = ready
      ? 'Ask the shopper for feedback and tap the microphone to begin.'
      : 'Choose a product and confirm consent to enable recording.';
  }

  function resetRecorderUI() {
    $('micBtn').className = 'mic';
    $('micLabel').textContent = 'Tap to Record';
    $('timer').className = 'timer hide';
    $('timer').textContent = '00:00';
    $('waveform').className = 'hide';
    $('stopBtn').className = 'btn danger hide';
    $('liveCard').className = 'card hide';
    $('livePreview').textContent = '';
    $('transcriptEdit').value = '';
    $('setupCard').classList.remove('hide');
    S.liveText = '';
  }

  /* ------------------------------------------------------------------ */
  /* recording                                                          */
  /* ------------------------------------------------------------------ */
  function pickMime() {
    var candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/aac', ''];
    if (typeof MediaRecorder === 'undefined') return null;
    for (var i = 0; i < candidates.length; i++) {
      if (candidates[i] === '' || MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return null;
  }

  function startRecording() {
    // Live-text-only mode never touches MediaRecorder, so the recogniser
    // gets the microphone to itself.
    if (S.mode === 'TRANSCRIPT') {
      S.chunks = []; S.blob = null; S.mime = ''; S.liveText = '';
      S.startedAt = Date.now();
      paintRecordingUI();
      startTimer();
      startRecognition();
      return;
    }
    if (typeof MediaRecorder === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('Recording not supported', 'Please open this app in Chrome or Safari on your phone.', 'err');
      return;
    }
    var mime = pickMime();
    if (mime === null) { toast('Recording not supported', 'This browser cannot record audio.', 'err'); return; }

    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).then(function (stream) {
      S.stream = stream;
      S.chunks = [];
      try {
        S.rec = mime ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 48000 })
                     : new MediaRecorder(stream);
      } catch (e) { S.rec = new MediaRecorder(stream); }
      S.mime = S.rec.mimeType || mime || 'audio/webm';

      S.rec.ondataavailable = function (e) { if (e.data && e.data.size) S.chunks.push(e.data); };
      S.rec.onerror = function () { toast('Recording failed', 'Something interrupted the recording. Please try again.', 'err'); stopRecording(true); };
      S.rec.onstop = onRecorderStop;
      S.rec.start(250);

      S.startedAt = Date.now();
      paintRecordingUI();
      startTimer();
      startWaveform(stream);
      startRecognition();
    })['catch'](function (err) { diagnoseMicFailure(err); });
  }

  /* A rejected getUserMedia has several very different causes. Tell the SPG
     which one it actually is, because the fix is different for each. */
  function diagnoseMicFailure(err) {
    var name = err && err.name;

    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      toast('No microphone found', 'This device has no microphone we can use.', 'err');
      return;
    }
    if (name === 'NotReadableError' || name === 'AbortError') {
      toast('Microphone is busy', 'Another app is using the microphone. Close it and try again.', 'err');
      return;
    }
    if (name !== 'NotAllowedError' && name !== 'SecurityError') {
      toast('Microphone unavailable', 'The microphone could not be started. Please try again.', 'err');
      return;
    }

    // NotAllowedError with no prompt = the page was never allowed to ask.
    if (SANDBOXED) {
      showBlockedBanner(
        'This page cannot use the microphone',
        'You have opened the app inside Google Apps Script, which blocks microphone access. ' +
        'Open the hosted app address instead — the one you published to GitHub Pages or Firebase Hosting.');
      return;
    }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      showBlockedBanner('This page is not secure',
        'Microphone access needs an https:// address. Open the app over https and try again.');
      return;
    }
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'microphone' }).then(function (p) {
        if (p.state === 'denied') {
          showBlockedBanner('Microphone blocked for this site',
            'Tap the lock or ⓘ icon next to the address, choose Permissions, allow Microphone, then reload this page.');
        } else {
          showBlockedBanner('Chrome has no microphone access',
            'The browser itself is blocked at the phone level. Open Settings → Apps → Chrome → Permissions → Microphone → Allow, then reload.');
        }
      })['catch'](function () {
        showBlockedBanner('Microphone blocked',
          'Allow microphone access for this site in your browser settings, then reload the page.');
      });
      return;
    }
    showBlockedBanner('Microphone blocked',
      'Allow microphone access for this site in your browser settings, then reload the page.');
  }

  /* A toast disappears; this problem needs to stay on screen. */
  function showBlockedBanner(title, detail) {
    $('micHint').innerHTML = '<b style="color:var(--rec)">' + esc(title) + '</b><br>' + esc(detail);
    $('micBtn').disabled = true;
    toast(title, detail, 'err');
  }

  function paintRecordingUI() {
    $('micBtn').className = 'mic recording';
    $('micLabel').innerHTML = '<span class="rec-dot"></span>Recording';
    $('micHint').textContent = 'Maximum ' + mmss(S.maxSeconds) + '. Tap stop when the shopper finishes.';
    $('timer').className = 'timer';
    $('waveform').className = '';
    $('stopBtn').className = 'btn danger';
    $('setupCard').classList.add('hide');
  }

  function startTimer() {
    clearInterval(S.timerId);
    S.timerId = setInterval(function () {
      var s = (Date.now() - S.startedAt) / 1000;
      $('timer').textContent = mmss(s);
      if (s >= S.maxSeconds) { toast('Maximum length reached', 'Recording stopped at ' + mmss(S.maxSeconds) + '.'); stopRecording(); }
    }, 200);
  }

  function startWaveform(stream) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      S.audioCtx = new Ctx();
      var src = S.audioCtx.createMediaStreamSource(stream);
      S.analyser = S.audioCtx.createAnalyser();
      S.analyser.fftSize = 128;
      src.connect(S.analyser);

      var cv = $('waveform'), ctx = cv.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
      var data = new Uint8Array(S.analyser.frequencyBinCount);

      (function draw() {
        S.rafId = requestAnimationFrame(draw);
        S.analyser.getByteFrequencyData(data);
        ctx.clearRect(0, 0, cv.width, cv.height);
        var bars = 34, gap = 4 * dpr;
        var w = (cv.width - gap * (bars - 1)) / bars;
        for (var i = 0; i < bars; i++) {
          var v = data[Math.floor(i * data.length / bars)] / 255;
          var h = Math.max(3 * dpr, v * cv.height * 0.92);
          var x = i * (w + gap), y = (cv.height - h) / 2;
          var g = ctx.createLinearGradient(0, y, 0, y + h);
          g.addColorStop(0, '#FB7185'); g.addColorStop(1, '#E11D48');
          ctx.fillStyle = g;
          if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, w / 2); ctx.fill(); }
          else ctx.fillRect(x, y, w, h);
        }
      })();
    } catch (e) { /* waveform is decorative — never block recording */ }
  }

  /* Sinhala speech recognition. Chrome ends a session on silence, so we
     restart it while recording. Every failure is reported on screen — a
     silent recogniser is the hardest thing to debug in the field. */
  function liveMsg(text, bad) {
    $('liveCard').className = 'card';
    $('livePreview').innerHTML = bad
      ? '<span style="color:var(--rec);font-weight:600">' + esc(text) + '</span>'
      : esc(text);
  }

  function startRecognition() {
    if (S.mode === 'AUDIO') { $('liveCard').className = 'card hide'; return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      liveMsg('This browser cannot transcribe Sinhala. Use Chrome on Android, or dictate with your keyboard afterwards.', true);
      return;
    }
    S.recognising = true;
    S.srError = '';
    liveMsg('Listening…');

    var make = function () {
      var r = new SR();
      r.lang = 'si-LK';
      r.continuous = true;          // ignored on Android — onend restarts us
      r.interimResults = true;
      r.maxAlternatives = 1;

      r.onresult = function (ev) {
        var finalTxt = '', interim = '';
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          var t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) finalTxt += t + ' '; else interim += t;
        }
        if (finalTxt) S.liveText += finalTxt;
        $('liveCard').className = 'card';
        $('livePreview').textContent = (S.liveText + interim).trim();
      };

      r.onend = function () {
        if (S.recognising) { try { S.speech = make(); S.speech.start(); } catch (e) {} }
      };

      r.onerror = function (e) {
        var code = (e && e.error) || 'unknown';
        S.srError = code;
        diagPush('recognition error: ' + code);

        if (code === 'no-speech' || code === 'aborted') return;   // onend restarts

        S.recognising = false;
        if (code === 'audio-capture') {
          liveMsg('This phone will not record audio and transcribe at the same time. Switch “Capture mode” to “Live text only”, or use “Audio only” and dictate afterwards.', true);
        } else if (code === 'not-allowed' || code === 'service-not-allowed') {
          liveMsg('Speech recognition is not allowed. Allow the microphone for this site and reload.', true);
        } else if (code === 'language-not-supported') {
          liveMsg('This browser will not transcribe Sinhala (si-LK). Record the audio and dictate the text with your keyboard.', true);
        } else if (code === 'network') {
          liveMsg('No connection to the speech service. Check the internet — the recording is still being saved.', true);
        } else {
          liveMsg('Live transcription stopped (' + code + '). The recording is still being saved.', true);
        }
      };
      return r;
    };

    try { S.speech = make(); S.speech.start(); }
    catch (e) { S.recognising = false; liveMsg('Live transcription could not start on this phone.', true); }
  }

  function stopRecognition() {
    S.recognising = false;
    if (S.speech) { try { S.speech.stop(); } catch (e) {} S.speech = null; }
  }

  function stopRecording(silent) {
    clearInterval(S.timerId);
    cancelAnimationFrame(S.rafId);
    stopRecognition();
    S.duration = Math.round((Date.now() - S.startedAt) / 1000);
    if (S.mode === 'TRANSCRIPT') { onCaptureFinished(); return; }
    if (S.rec && S.rec.state !== 'inactive') { try { S.rec.stop(); } catch (e) {} }
    else if (!silent) resetRecorderUI();
  }

  function releaseStream() {
    if (S.stream) { S.stream.getTracks().forEach(function (t) { t.stop(); }); S.stream = null; }
    if (S.audioCtx) { try { S.audioCtx.close(); } catch (e) {} S.audioCtx = null; }
  }

  function onRecorderStop() {
    releaseStream();
    if (!S.chunks.length) {
      diagPush('MediaRecorder produced 0 bytes');
      toast('Nothing recorded', 'No audio was captured. If you were also transcribing, switch Capture mode to “Audio only” on this phone.', 'err');
      resetRecorderUI();
      return;
    }
    S.blob = new Blob(S.chunks, { type: S.mime });
    if (S.blobUrl) URL.revokeObjectURL(S.blobUrl);
    S.blobUrl = URL.createObjectURL(S.blob);
    onCaptureFinished();
  }

  function onCaptureFinished() {

    var sel = $('product');
    var opt = sel.options[sel.selectedIndex];
    S.current = {
      productCode: sel.value,
      productName: opt ? opt.getAttribute('data-name') : sel.value,
      duration: S.duration
    };

    if (S.blob) { $('player').src = S.blobUrl; $('player').className = ''; }
    else { $('player').removeAttribute('src'); $('player').className = 'hide'; }
    $('chipProduct').textContent = S.current.productName;
    $('chipDuration').textContent = mmss(S.duration);
    $('chipId').textContent = S.blob ? 'Saving audio…' : 'Saving…';
    $('reviewMeta').textContent = 'Play it back to check it captured the shopper, then save.';
    $('transcriptEdit').value = (S.liveText || '').trim();
    $('transcriptEdit').value = '';
    $('transcriptEdit').className = 'textarea si hide';
    $('btnNoteToggle').textContent = 'Add a note (optional)';
    $('btnSave').disabled = true;
    go('review');
    upload();
  }

  /* ------------------------------------------------------------------ */
  /* upload + transcribe                                                */
  /* ------------------------------------------------------------------ */
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  function upload() {
    var prep = S.blob ? blobToBase64(S.blob) : Promise.resolve('');
    prep.then(function (b64) {
      return api('processFeedback', {
        spgCode: S.spg.code,
        productCode: S.current.productCode,
        productName: S.current.productName,
        duration: S.current.duration,
        mimeType: S.mime,
        consent: true,
        transcript: $('transcriptEdit').value,
        noAudio: !S.blob,
        audioBase64: b64
      });
    }).then(function (r) {
      if (!r.ok) {
        $('chipId').textContent = 'Not saved';
        $('btnSave').disabled = true;
        toast('Upload failed', r.message || 'Please try recording again.', 'err');
        return;
      }
      S.current.feedbackId = r.feedbackId;
      $('chipId').textContent = r.feedbackId;
      $('btnSave').disabled = false;
    })['catch'](function () {
      $('chipId').textContent = 'Not saved';
      toast('Upload failed', 'Your connection dropped. The recording is still on this phone — try recording again.', 'err');
    });
  }

  /* ------------------------------------------------------------------ */
  /* save / discard                                                     */
  /* ------------------------------------------------------------------ */
  function save() {
    if (!S.current || !S.current.feedbackId) { toast('Not ready', 'The recording is still uploading.', 'err'); return; }
    busy(true, 'Saving…');
    api('confirmFeedback', { feedbackId: S.current.feedbackId, spgCode: S.spg.code,
                             note: $('transcriptEdit').value.trim() })
      .then(function (r) {
        busy(false);
        if (!r.ok) { toast('Could not save', r.message || 'Please try again.', 'err'); return; }
        $('successId').textContent = r.feedbackId;
        bumpTodayCount();
        go('success');
      })['catch'](function () { busy(false); toast('No connection', 'We could not save. Please try again.', 'err'); });
  }

  function discard() {
    if (!S.current || !S.current.feedbackId) { startNew(); return; }
    if (!window.confirm('Discard this recording?')) return;
    busy(true, 'Discarding…');
    api('discardFeedback', { feedbackId: S.current.feedbackId, spgCode: S.spg.code })
      .then(function () { busy(false); startNew(); })
      ['catch'](function () { busy(false); startNew(); });
  }

  function bumpTodayCount() {
    $('todayCount').textContent = (parseInt($('todayCount').textContent, 10) || 0) + 1;
  }

  /* ------------------------------------------------------------------ */
  /* history                                                            */
  /* ------------------------------------------------------------------ */
  function loadHistory() {
    if (!S.spg) return;
    var list = $('historyList');
    list.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
    api('getSPGHistory', { spgCode: S.spg.code, limit: 40 }).then(function (r) {
      if (!r.ok || !r.items.length) {
        list.innerHTML = '<div class="empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>' +
          '<p>No feedback recorded yet.</p></div>';
        return;
      }
      $('historySub').textContent = r.todayCount + ' today · ' + r.items.length + ' recent';
      list.innerHTML = r.items.map(function (it) {
        var pending = it.status === 'PENDING_TRANSCRIPTION' || it.status === 'DRAFT';
        var failed = it.status === 'TRANSCRIPTION_FAILED';
        return '' +
          '<div class="item">' +
            '<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></div>' +
            '<div class="body">' +
              '<div class="t1"><span>' + esc(it.productName || it.productCode) + '</span>' +
                '<span style="color:var(--muted);font-weight:600;font-size:12px">' + esc(it.time.slice(0, 5)) + '</span></div>' +
              '<div class="t2">' + esc(it.date) + ' · ' + mmss(it.duration) +
                (pending ? ' · <span style="color:var(--muted)">transcribing…</span>' : '') +
                (failed ? ' · <span style="color:var(--warn)">transcript failed</span>' : '') + '</div>' +
              (it.transcript ? '<div class="t3">' + esc(it.transcript) + '</div>' : '') +
              (it.hasAudio === false ? '<div class="t2" style="margin-top:8px">Text only — no recording</div>'
                : '<button class="btn ghost sm" style="margin-top:10px;width:auto;padding:0 14px" ' +
                  'onclick="App.play(this,\'' + esc(it.feedbackId) + '\')">▶ Play</button>') +
            '</div>' +
          '</div>';
      }).join('');
    })['catch'](function () {
      list.innerHTML = '<div class="empty"><p>We could not load your history. Check your connection.</p></div>';
    });
  }

  function play(btn, feedbackId) {
    btn.disabled = true; btn.textContent = 'Loading…';
    api('getAudio', { feedbackId: feedbackId, spgCode: S.spg.code }).then(function (r) {
      btn.disabled = false; btn.textContent = '▶ Play';
      if (!r.ok) { toast('Cannot play', r.message || 'Recording unavailable.', 'err'); return; }
      var el = document.createElement('audio');
      el.controls = true; el.autoplay = true;
      el.src = 'data:' + r.mimeType + ';base64,' + r.base64;
      btn.parentNode.replaceChild(el, btn);
    })['catch'](function () {
      btn.disabled = false; btn.textContent = '▶ Play';
      toast('Cannot play', 'Please check your connection.', 'err');
    });
  }

  /* ------------------------------------------------------------------ */
  /* diagnostics                                                        */
  /* ------------------------------------------------------------------ */
  function diagPush(line) {
    var t = new Date().toISOString().slice(11, 19);
    S.diag.push(t + '  ' + line);
    if ($('diagLog')) $('diagLog').textContent = S.diag.join('\n');
  }

  function paintDiagFacts() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var mr = (typeof MediaRecorder !== 'undefined');
    var rows = [
      ['Address', location.protocol + '//' + location.hostname, location.protocol === 'https:' || location.hostname === 'localhost'],
      ['Inside a frame', SANDBOXED ? 'yes — microphone blocked' : 'no', !SANDBOXED],
      ['Audio recording', mr ? 'supported' : 'not supported', mr],
      ['Recording format', mr ? (pickMime() || 'browser default') : '—', mr],
      ['Speech recognition', SR ? 'available' : 'not available', !!SR],
      ['Capture mode', S.mode, true]
    ];
    $('diagFacts').innerHTML = rows.map(function (r) {
      return '<div class="diag-row"><span>' + esc(r[0]) + '</span><b class="' +
             (r[2] ? 'diag-ok' : 'diag-bad') + '">' + esc(r[1]) + '</b></div>';
    }).join('') +
    '<div class="diag-row" style="display:block"><span>Browser</span>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word">' +
    esc(navigator.userAgent) + '</div></div>';

    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'microphone' }).then(function (p) {
        $('diagFacts').insertAdjacentHTML('beforeend',
          '<div class="diag-row"><span>Microphone permission</span><b class="' +
          (p.state === 'granted' ? 'diag-ok' : p.state === 'denied' ? 'diag-bad' : 'diag-warn') +
          '">' + esc(p.state) + '</b></div>');
      })['catch'](function () {});
    }
  }

  /* Records for 4s, then runs the recogniser ALONE for 6s. That separation is
     the whole point: it tells us whether each half works on its own. */
  function runDiagTest() {
    S.diag = []; S.diagRec = false; S.diagSr = false; diagPush('starting');
    var btn = $('btnDiagRun'); btn.disabled = true; btn.textContent = 'Testing…';

    var step1 = new Promise(function (resolve) {
      if (typeof MediaRecorder === 'undefined' || !navigator.mediaDevices) { diagPush('PART 1 recording: unsupported'); return resolve(); }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        diagPush('PART 1 recording: microphone opened');
        var chunks = [], mime = pickMime();
        var rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          var bytes = chunks.reduce(function (n, c) { return n + c.size; }, 0);
          S.diagRec = bytes > 1000;
          diagPush('PART 1 recording: ' + bytes + ' bytes captured — ' + (S.diagRec ? 'OK' : 'FAILED'));
          stream.getTracks().forEach(function (t) { t.stop(); });
          resolve();
        };
        rec.start(250);
        setTimeout(function () { try { rec.stop(); } catch (e) { resolve(); } }, 4000);
      })['catch'](function (e) { diagPush('PART 1 recording: ' + (e.name || e) + ' — FAILED'); resolve(); });
    });

    step1.then(function () {
      return new Promise(function (resolve) {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { diagPush('PART 2 speech: not available in this browser — FAILED'); return resolve(); }
        diagPush('PART 2 speech: say a few words in Sinhala now…');
        var got = '', done = false, r = new SR();
        r.lang = 'si-LK'; r.interimResults = true; r.continuous = true;
        r.onresult = function (ev) {
          for (var i = ev.resultIndex; i < ev.results.length; i++) got += ev.results[i][0].transcript;
          $('diagLog').textContent = S.diag.join('\n') + '\n   heard: ' + got;
        };
        r.onerror = function (e) { S.srError = (e && e.error) || 'unknown'; diagPush('PART 2 speech: error ' + S.srError + ' — FAILED'); };
        r.onend = function () {
          if (done) return;
          done = true;
          S.diagSr = !!got.trim();
          diagPush('PART 2 speech: heard "' + got.trim() + '" — ' + (S.diagSr ? 'OK' : 'nothing recognised'));
          resolve();
        };
        try { r.start(); } catch (e) { diagPush('PART 2 speech: could not start — FAILED'); resolve(); }
        setTimeout(function () { try { r.stop(); } catch (e) {} if (!done) { done = true; resolve(); } }, 6000);
      });
    }).then(function () {
      diagPush('done');
      diagPush('VERDICT: ' + verdict());
      btn.disabled = false; btn.textContent = 'Run microphone test again';
    });
  }

  function verdict() {
    if (S.diagRec && S.diagSr) return 'both work — try Capture mode "Audio + live text". If the transcript stays empty while recording, this phone cannot do both at once: use "Audio only" and dictate.';
    if (S.diagRec && !S.diagSr) return 'recording works, speech recognition does not (' + (S.srError || 'no result') + ') — use Capture mode "Audio only" and dictate the text.';
    if (!S.diagRec && S.diagSr) return 'speech works, recording does not — use Capture mode "Live text only".';
    return 'neither worked — check the address starts with https and that the microphone is allowed for this site.';
  }

  function copyDiag() {
    var text = ['SPG Shopper Voice — device report', new Date().toISOString(),
                navigator.userAgent, location.href, '', $('diagFacts').innerText, '', S.diag.join('\n')].join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Report copied', 'Paste it into a message.', 'ok'); })
        ['catch'](function () { window.prompt('Copy this report:', text); });
    } else { window.prompt('Copy this report:', text); }
  }

  /* ------------------------------------------------------------------ */
  /* boot                                                               */
  /* ------------------------------------------------------------------ */
  function boot() {
    $('btnLogin').addEventListener('click', login);
    $('spgCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    $('product').addEventListener('change', updateMicState);
    $('consent').addEventListener('change', updateMicState);
    $('micBtn').addEventListener('click', startRecording);
    S.srSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
      b.addEventListener('click', function () { setMode(b.dataset.mode); });
    });
    $('btnNoteToggle').addEventListener('click', function () {
      var t = $('transcriptEdit'), hidden = t.className.indexOf('hide') > -1;
      t.className = 'textarea si' + (hidden ? '' : ' hide');
      $('btnNoteToggle').textContent = hidden ? 'Hide note' : 'Add a note (optional)';
      if (hidden) { t.focus(); t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    });
    $('btnDiagRun').addEventListener('click', runDiagTest);
    $('btnDiagCopy').addEventListener('click', copyDiag);
    var savedMode = null;
    try { savedMode = localStorage.getItem('captureMode'); } catch (e) {}
    setMode(savedMode || 'AUDIO');
    $('stopBtn').addEventListener('click', function () { stopRecording(); });
    Array.prototype.forEach.call(document.querySelectorAll('.nav button'), function (b) {
      b.addEventListener('click', function () { b.dataset.go === 'record' ? startNew() : go(b.dataset.go); });
    });

    // Warn if the page is running inside the Apps Script iframe (mic is blocked there).
    if (SANDBOXED) {
      var w = $('micWarning');
      w.hidden = false;
      w.innerHTML = '<b>Recording will not work on this address.</b> The page is running inside ' +
                    'Google Apps Script, which blocks the microphone. Login and history work here, ' +
                    'but to record you must open the hosted app address (see README).';
    }

    // One-time server address setup, only when nothing is configured yet.
    if (!IN_GAS && !resolveApiUrl()) {
      $('apiSetup').className = 'card';
      $('btnLogin').disabled = true;
    }
    $('btnApiSave').addEventListener('click', function () {
      var v = ($('apiInput').value || '').trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v)) {
        toast('That address does not look right', 'It should start with https://script.google.com/macros/s/ and end with /exec', 'err');
        return;
      }
      try { localStorage.setItem('apiUrl', v); } catch (e) {}
      $('apiSetup').className = 'card hide';
      $('btnLogin').disabled = false;
      toast('Address saved', 'You can sign in now.', 'ok');
    });

    var saved = null;
    try { saved = localStorage.getItem('spgCode'); } catch (e) {}
    if (saved) { $('spgCode').value = saved; }

    window.addEventListener('beforeunload', function (e) {
      if (S.rec && S.rec.state === 'recording') { e.preventDefault(); e.returnValue = ''; }
    });
  }

  document.addEventListener('DOMContentLoaded', boot);

  return {
    go: go, login: login, logout: logout, startNew: startNew,
    save: save, discard: discard, play: play, setMode: setMode
  };
})();
</script>
